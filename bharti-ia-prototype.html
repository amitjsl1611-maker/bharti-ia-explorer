<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bharti.com — IA Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:'Lato',sans-serif;font-size:13px;color:#111}

/* ── TOP BAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:64px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;z-index:200;
}
.tb-left{display:flex;align-items:center;gap:16px}
.tb-brand{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#2f97da}
.tb-sep{width:1px;height:22px;background:#e0e0e0}
.tb-file{font-size:12px;color:#999;letter-spacing:.01em;font-weight:400}
.tb-center{display:flex;align-items:center;gap:3px;background:#ddeef9;border-radius:11px;padding:4px}
.mode-btn{
  padding:8px 22px;border-radius:8px;border:none;cursor:pointer;
  font-size:13px;font-weight:700;letter-spacing:.01em;
  font-family:'Lato',sans-serif;
  background:transparent;color:#8ab4cc;transition:all .2s cubic-bezier(.4,0,.2,1);
}
.mode-btn.active{
  background:#fff;color:#2f97da;
  box-shadow:0 2px 8px rgba(47,151,218,.15),0 1px 3px rgba(0,0,0,.08);
}
.tb-right{display:flex;align-items:center;gap:8px}
.zoom-btn{
  width:32px;height:32px;border:1px solid #e0e0e0;border-radius:8px;
  background:#fff;cursor:pointer;font-size:15px;color:#555;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s;
}
.zoom-btn:hover{border-color:#999;background:#f7f7f7}
.zoom-label{font-size:12px;color:#999;min-width:42px;text-align:center;font-weight:700}
.kbd-hint{font-size:11px;color:#bbb;letter-spacing:.01em}

/* ── CANVAS CONTAINER ── */
#container{
  position:fixed;top:130px;left:0;right:0;bottom:0;
  overflow:hidden;cursor:grab;
  background-color:#fafafa;
  background-image:radial-gradient(circle,#d8d8d8 1px,transparent 1px);
  background-size:24px 24px;
}
#container.panning{cursor:grabbing}

/* ── CANVAS ── */
#canvas{
  position:absolute;top:0;left:0;
  width:22400px;height:2000px;
  transform-origin:0 0;
  will-change:transform;
}

/* ── SVG OVERLAY ── */
#svg{position:absolute;top:0;left:0;width:22400px;height:2000px;pointer-events:none;overflow:visible}

/* ── PILLS ── */
.pill{
  position:absolute;display:flex;align-items:center;justify-content:center;
  text-align:center;border-radius:6px;cursor:pointer;user-select:none;
  font-weight:600;white-space:nowrap;transition:box-shadow .2s,opacity .3s;
  font-family:'Lato',sans-serif;
}
.pill:hover{box-shadow:0 4px 16px rgba(0,0,0,.18)}
.pill-start{background:#F5B840;color:#1A1A1A;font-size:13px;height:38px}
.pill-l1{background:#3D6B35;color:#fff;font-size:12px;height:34px;letter-spacing:.01em}
.pill-l1.utility{background:#1A3A5C;color:#fff}
.pill-l2{background:#1A4040;color:#fff;font-size:10.5px;height:30px}
.pill-l2.utility{background:#1A3050}
.pill-l3{background:#333;color:#fff;font-size:10px;height:26px;border-radius:4px}
.pill.highlight{box-shadow:0 0 0 3px #fff,0 0 0 5px #6B3FD4;z-index:10}
.pill.dimmed{opacity:.25}

/* ── CARDS (IA mode only) ── */
.card{
  position:absolute;background:#fff;border:1.5px solid #e0e0e0;border-radius:8px;
  overflow:hidden;width:440px;transition:opacity .3s,border-color .2s;
}
.card:hover{border-color:#aaa}
.card.ia-el{opacity:1}
body.sitemap .card{opacity:0;pointer-events:none}
.card-desc{
  padding:10px 14px;font-size:9.5px;font-style:italic;color:#777;
  border-bottom:1px solid #f0f0f0;background:#fafafa;line-height:1.5;
}
.band{padding:5px 14px;font-size:9px;font-weight:600;letter-spacing:.08em}
.band-i{background:#E6F4F4;color:#1A4040}
.band-a{background:#FFF8E8;color:#7A5500}
.bullet{padding:3px 14px;font-size:9.5px;color:#333;line-height:1.5}

/* ── TOUR BAR (FLOATING ISLAND) ── */
#tourbar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(0,0,0,.08);border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.05);
  display:flex;align-items:stretch;gap:0;z-index:200;
  overflow:hidden;
  height:64px;
  min-width:640px;max-width:min(960px,calc(100vw - 80px));
}
.tb-nav-text{
  display:flex;align-items:center;justify-content:center;gap:4px;
  padding:0 20px;cursor:pointer;border:none;background:transparent;
  font-family:'Lato',sans-serif;font-size:12px;font-weight:700;
  color:#666;letter-spacing:.02em;
  transition:background .15s,color .15s;flex-shrink:0;white-space:nowrap;
}
.tb-nav-text:hover{background:rgba(0,0,0,.04);color:#111}
.tb-nav-text:disabled{color:#ccc;cursor:default}
.tb-nav-text:disabled:hover{background:transparent;color:#ccc}
.tb-divider{width:1px;background:rgba(0,0,0,.07);margin:12px 0;flex-shrink:0}
#tour-content{
  flex:1;padding:0 20px;display:flex;flex-direction:column;justify-content:center;gap:3px;
  overflow:hidden;min-width:0;
}
#bc-l1{
  font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#aaa;cursor:pointer;transition:color .2s;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
#bc-l1:hover{color:#2f97da}
#tour-name{
  font-size:14px;font-weight:700;color:#111;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#tour-desc{font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
#tour-chips{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden}
.chip{
  padding:4px 11px;border-radius:20px;border:1px solid #e2e2e2;
  background:rgba(255,255,255,.9);font-size:10.5px;color:#555;cursor:pointer;
  white-space:nowrap;transition:all .2s cubic-bezier(.4,0,.2,1);flex-shrink:0;
  font-family:'Lato',sans-serif;font-weight:700;
}
.chip:hover{background:#1A4040;color:#fff;border-color:#1A4040}
.chip.l3-chip{background:#f2f2f2;border-color:#ddd;color:#555}
.tb-right-panel{
  display:flex;align-items:center;justify-content:center;
  gap:8px;padding:0 16px;flex-shrink:0;
}
#tour-counter{font-size:10.5px;color:#bbb;letter-spacing:.06em;font-weight:700;white-space:nowrap}
#tour-jump{
  padding:5px 10px;border:1px solid #e0e0e0;border-radius:8px;
  font-size:11px;color:#555;background:#fff;cursor:pointer;max-width:150px;
  font-family:'Lato',sans-serif;
}
#btn-tour{
  padding:7px 18px;border-radius:20px;border:none;cursor:pointer;
  font-size:11.5px;font-weight:700;letter-spacing:.03em;
  font-family:'Lato',sans-serif;
  background:#1A4040;color:#fff;transition:background .2s,transform .1s;
  white-space:nowrap;
}
#btn-tour:hover{background:#0e2b2b;transform:scale(1.02)}
#btn-tour:active{transform:scale(0.97)}
#btn-tour.active{background:#c0392b}
#btn-tour.active:hover{background:#a93226}

/* ── OVERVIEW OVERLAY ── */
#overview-hint{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(255,255,255,.95);border:1px solid #e8e8e8;border-radius:16px;
  padding:36px 40px 32px;text-align:center;z-index:300;
  box-shadow:0 8px 40px rgba(0,0,0,.12);max-width:420px;width:90%;
  transition:opacity .4s;
}
#overview-hint-close{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;border:none;background:transparent;
  cursor:pointer;color:#bbb;display:flex;align-items:center;justify-content:center;
  border-radius:8px;transition:background .15s,color .15s;
}
#overview-hint-close:hover{background:#f4f4f4;color:#555}
#overview-hint h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px;color:#111}
#overview-hint p{font-size:12.5px;color:#888;line-height:1.7;margin-bottom:24px}
#overview-hint .btn-primary{
  padding:10px 28px;border-radius:20px;border:none;cursor:pointer;
  background:#2f97da;color:#fff;font-size:13px;font-weight:700;
  font-family:'Lato',sans-serif;margin-right:10px;transition:background .2s,transform .1s;
}
#overview-hint .btn-primary:hover{background:#2485c4}
#overview-hint .btn-primary:active{transform:scale(0.97)}
#overview-hint .btn-sec{
  padding:10px 20px;border-radius:20px;border:none;cursor:pointer;
  background:transparent;color:#aaa;font-size:13px;font-family:'Lato',sans-serif;font-weight:400;
  transition:color .2s;
}
#overview-hint .btn-sec:hover{color:#666}
#overview-hint.hidden{opacity:0;pointer-events:none}


/* ── ISLAND NAV ── */
#island-nav{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(0,0,0,.08);border-radius:10px;
  box-shadow:0 4px 24px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.05);
  display:flex;align-items:stretch;
  z-index:190;padding:0 4px;gap:0;
  white-space:nowrap;overflow:hidden;
}
.inav-tab{
  display:flex;align-items:center;gap:6px;
  padding:10px 14px;cursor:pointer;position:relative;
  border:none;background:transparent;
  font-family:'Lato',sans-serif;font-size:12px;font-weight:700;
  color:#999;letter-spacing:.01em;
  transition:color .2s;
  border-bottom:2px solid transparent;
}
.inav-tab:hover{color:#444}
.inav-tab.active{color:#111;border-bottom-color:#2f97da}
.inav-tab .inav-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  font-size:10px;font-weight:700;line-height:1;
  background:#eef6fd;color:#2f97da;
  transition:background .2s,color .2s;
}
.inav-tab.active .inav-count{background:#2f97da;color:#fff}
.inav-sep{width:1px;background:rgba(0,0,0,.07);margin:8px 0;flex-shrink:0}

/* ── SECTION HIGHLIGHT BOX ── */
.section-box{
  position:absolute;border-radius:10px;pointer-events:none;
  opacity:0;transition:opacity .4s;
  border:2px solid #6B3FD4;
  background:rgba(107,63,212,.04);
}
.section-box.visible{opacity:1}

/* ── SHOW L2 CTA ── */
.show-l2-btn{
  position:absolute;display:none;flex-direction:column;align-items:center;
  cursor:pointer;z-index:5;transform:translateX(-50%);
}
.show-l2-btn.visible{display:flex}
.show-l2-rings{
  position:relative;width:56px;height:56px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.ping-ring{
  position:absolute;width:56px;height:56px;
  border:2px solid rgba(47,151,218,.55);
  border-radius:50%;
  animation:ping-out 2s ease-out infinite;
}
.ping-ring:nth-child(2){animation-delay:.67s}
.ping-ring:nth-child(3){animation-delay:1.33s}
@keyframes ping-out{
  0%{transform:scale(0.45);opacity:.9}
  100%{transform:scale(2.2);opacity:0}
}
.show-l2-dot{
  width:12px;height:12px;background:#2f97da;
  border-radius:50%;position:relative;z-index:2;
  box-shadow:0 0 0 3px rgba(47,151,218,.2);
}
.show-l2-label{
  background:#fff;border:1.5px solid #2f97da;
  color:#2f97da;font-family:'Lato',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:7px 18px;border-radius:20px;white-space:nowrap;
  box-shadow:0 2px 12px rgba(47,151,218,.18);
  transition:background .2s,color .2s;
}
.show-l2-btn:hover .show-l2-label{background:#2f97da;color:#fff}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="tb-left">
    <div class="tb-brand">Bharti Enterprises</div>
    <div class="tb-sep"></div>
    <div class="tb-file">Information Architecture &nbsp;v1.0</div>
  </div>
  <div class="tb-center">
    <button class="mode-btn active" id="btn-ia" onclick="setMode('ia')">IA View</button>
    <button class="mode-btn" id="btn-sm" onclick="setMode('sitemap')">Sitemap</button>
  </div>
  <div class="tb-right">
    <button class="zoom-btn" onclick="zoom(1.25)">+</button>
    <div class="zoom-label" id="zoom-label">7%</div>
    <button class="zoom-btn" onclick="zoom(0.8)">−</button>
    <button class="zoom-btn" onclick="resetView()" title="Reset view (R)">⊡</button>
    <div class="tb-sep"></div>
    <div class="kbd-hint">← → Navigate &nbsp;·&nbsp; Scroll Zoom &nbsp;·&nbsp; Drag Pan</div>
  </div>
</div>

<!-- ISLAND NAV -->
<div id="island-nav"></div>

<!-- CANVAS CONTAINER -->
<div id="container">
  <div id="canvas">
    <svg id="svg"></svg>
  </div>
</div>

<!-- MINIMAP -->

<!-- OVERVIEW HINT -->
<div id="overview-hint">
  <button id="overview-hint-close" onclick="closeHint()" title="Close"><i data-lucide="x" style="width:18px;height:18px;stroke-width:2.5"></i></button>
  <h2>Bharti.com &nbsp;·&nbsp; IA Explorer</h2>
  <p>9 sections &nbsp;·&nbsp; 38 page templates<br>Use navigation buttons or pan freely</p>
  <button class="btn-primary" onclick="startTour()"><i data-lucide="play" style="width:14px;height:14px;fill:currentColor;stroke:none;display:inline-block;vertical-align:middle;margin-right:6px"></i>Start Guided Tour</button>
</div>

<!-- TOUR BAR (FLOATING ISLAND) -->
<div id="tourbar">
  <button class="tb-nav-text" id="btn-prev" onclick="prevStop()" disabled>
    <i data-lucide="chevron-left" style="width:14px;height:14px;stroke-width:2.5"></i>Previous
  </button>
  <div class="tb-divider"></div>
  <div id="tour-content">
    <span id="bc-l1" onclick="goBackToL1()">—</span>
    <div id="tour-name">Bharti.com — Information Architecture</div>
    <div id="tour-desc"></div>
    <div id="tour-chips"></div>
  </div>
  <div class="tb-divider"></div>
  <div class="tb-right-panel">
    <div id="tour-counter">—</div>
    <select id="tour-jump" onchange="jumpToSection(this.value)">
      <option value="">Jump to section…</option>
    </select>
    <button id="btn-tour" onclick="toggleTour()"><i data-lucide="play" id="tour-icon" style="width:13px;height:13px;fill:currentColor;stroke:none;display:inline-block;vertical-align:middle;margin-right:5px"></i><span>Start Tour</span></button>
  </div>
  <div class="tb-divider"></div>
  <button class="tb-nav-text" id="btn-next" onclick="nextStop()">
    Next<i data-lucide="chevron-right" style="width:14px;height:14px;stroke-width:2.5"></i>
  </button>
</div>

// CAMERA STATE
// ═══════════════════════════════════════════
let tx=0, ty=0, sc=0.065;
let isPanning=false, panSX=0, panSY=0, panTX=0, panTY=0;
let tourActive=false, currentStop=-1, currentL2idx=-1;
let currentSectionId=null;
const l2Opened=new Set(); // tracks which sections currently have L2 visible

const canvas=document.getElementById('canvas');
const svg=document.getElementById('svg');
const container=document.getElementById('container');

// ═══════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════
function elt(tag,cls,style=''){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(style)e.style.cssText=style;
  return e;
}
function svgEl(tag,attrs={}){
  const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  return e;
}
let svgTarget=null; // null = svg root; set to <g> when building L2
function addLine(x1,y1,x2,y2,cls=''){
  const l=svgEl('line',{x1,y1,x2,y2,stroke:'#8B5FD4','stroke-width':'2','stroke-linecap':'round'});
  if(cls)l.classList.add(cls);
  (svgTarget||svg).appendChild(l);return l;
}
function addDot(cx,cy){
  (svgTarget||svg).appendChild(svgEl('circle',{cx,cy,r:'4',fill:'#8B5FD4'}));
}
function pill(label,cls,x,y,w,h,dataset={}){
  const p=elt('div',`pill ${cls}`);
  p.textContent=label;
  p.style.cssText=`left:${x-w/2}px;top:${y}px;width:${w}px;height:${h}px`;
  Object.entries(dataset).forEach(([k,v])=>p.dataset[k]=v);
  canvas.appendChild(p);return p;
}
function card(cx,y,w,desc,info,actions,cls=''){
  const c=elt('div',`card ia-el ${cls}`);
  c.style.cssText=`left:${cx-w/2}px;top:${y}px`;
  let h=`<div class="card-desc">${desc}</div>`;
  h+=`<div class="band band-i">INFORMATION</div>`;
  info.forEach(i=>h+=`<div class="bullet">– ${i}</div>`);
  h+=`<div class="band band-a">ACTIONS</div>`;
  actions.forEach(a=>h+=`<div class="bullet">→ ${a}</div>`);
  c.innerHTML=h;canvas.appendChild(c);return c;
}

// Build everything
function buildCanvas(){
  // START
  pill('BHARTI.COM','pill-start',START_CX,START_Y,200,38);
  addLine(START_CX,START_Y+38,START_CX,SPINE_Y);

  // Spine
  const allCX=SECTIONS.map(s=>s.cx);
  addLine(Math.min(...allCX),SPINE_Y,Math.max(...allCX),SPINE_Y);
  addDot(START_CX,SPINE_Y);

  SECTIONS.forEach(sec=>{
    // spine drop to L1
    addDot(sec.cx,SPINE_Y);
    addLine(sec.cx,SPINE_Y,sec.cx,L1_Y);
    // L1 pill
    const cls=sec.utility?'pill-l1 utility':'pill-l1';
    const l1p=pill(sec.name,cls,sec.cx,L1_Y,200,34,{section:sec.id});
    l1p.onclick=()=>focusSection(sec.id);
    // L1 card
    card(sec.cx,L1_CARD_Y,CW,sec.desc,sec.info,sec.actions,'l1-card');

    if(!sec.l2.length)return;

    // CTA button below L1 card
    const ctaBtn=elt('div','show-l2-btn');
    ctaBtn.dataset.l2sec=sec.id;
    ctaBtn.style.cssText=`left:${sec.cx}px;top:670px`;
    ctaBtn.innerHTML=`
      <div class="show-l2-rings">
        <div class="ping-ring"></div><div class="ping-ring"></div><div class="ping-ring"></div>
        <div class="show-l2-dot"></div>
      </div>
      <div class="show-l2-label">Show Level 2 info ↓</div>`;
    ctaBtn.onclick=()=>revealL2(sec.id);
    canvas.appendChild(ctaBtn);

    // L2 SVG group — hidden by default
    const l2g=svgEl('g',{'class':'l2-svg-group','data-l2sec':sec.id});
    l2g.style.display='none';
    svg.appendChild(l2g);
    svgTarget=l2g;

    // L2 spread connector
    const l2cxs=sec.l2.map(l=>l.cx);
    const l2L=Math.min(...l2cxs), l2R=Math.max(...l2cxs);
    addLine(sec.cx,L1_Y+34,sec.cx,L2_SY);
    addDot(sec.cx,L2_SY);
    if(l2L!==l2R)addLine(l2L,L2_SY,l2R,L2_SY);

    sec.l2.forEach(l2=>{
      addDot(l2.cx,L2_SY);
      addLine(l2.cx,L2_SY,l2.cx,L2_Y);
      // L2 pill — hidden by default
      const l2cls=sec.utility?'pill-l2 utility':'pill-l2';
      const l2p=pill(l2.name,l2cls,l2.cx,L2_Y,CW,30,{section:sec.id,l2name:l2.name,l2cx:l2.cx,level:'l2'});
      l2p.style.display='none';
      l2p.onclick=(e)=>{e.stopPropagation();focusL2(sec.id,sec.l2.indexOf(l2))};
      // L2 card — hidden by default
      addLine(l2.cx,L2_Y+30,l2.cx,L2_CARD_Y);
      const l2c=card(l2.cx,L2_CARD_Y,CW,l2.name,l2.info||[],l2.actions||[]);
      l2c.dataset.l2sec=sec.id;l2c.dataset.level='l2';
      l2c.style.display='none';

      // L3
      if(l2.l3&&l2.l3.length){
        const l3cxs=l2.l3.map(l=>l.cx);
        const l3L=Math.min(...l3cxs),l3R=Math.max(...l3cxs);
        addLine(l2.cx,L2_CARD_Y+280,l2.cx,L3_SY);
        addDot(l2.cx,L3_SY);
        if(l3L!==l3R)addLine(l3L,L3_SY,l3R,L3_SY);
        l2.l3.forEach(l3=>{
          addDot(l3.cx,L3_SY);
          addLine(l3.cx,L3_SY,l3.cx,L3_Y);
          const l3p=pill(l3.name,'pill-l3',l3.cx,L3_Y,CW-30,26,{l2sec:sec.id,level:'l3'});
          l3p.style.display='none';
        });
      }
    });

    svgTarget=null; // back to root
  });
}

// ═══════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════
function applyTransform(animate=false){
  canvas.style.transition=animate?'transform .75s cubic-bezier(0.4,0,0.2,1)':'none';
  canvas.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  if(animate)setTimeout(()=>canvas.style.transition='none',800);
  document.getElementById('zoom-label').textContent=Math.round(sc*100)+'%';
}
function flyTo(cx,cy,targetSc,animate=true){
  const vpw=container.clientWidth, vph=container.clientHeight;
  const destTx=vpw/2-cx*targetSc;
  const destTy=vph/2-cy*targetSc;
  if(animate){
    // Use smooth rAF path — cancel any previous loop first
    if(zoomRaf){cancelAnimationFrame(zoomRaf);zoomRaf=null;}
    zoomTarget={sc:targetSc,tx:destTx,ty:destTy};
    zoomEase=0.2; // faster for programmatic flyTo vs wheel zoom
    zoomRaf=requestAnimationFrame(smoothZoomStep);
  } else {
    tx=destTx;ty=destTy;sc=targetSc;
    zoomTarget={sc,tx,ty};
    applyTransform(false);
  }
}
function zoom(factor){
  const vpw=container.clientWidth, vph=container.clientHeight;
  const newSc=Math.max(0.04,Math.min(3,zoomTarget.sc*factor));
  zoomTarget.tx=vpw/2-(vpw/2-zoomTarget.tx)*newSc/zoomTarget.sc;
  zoomTarget.ty=vph/2-(vph/2-zoomTarget.ty)*newSc/zoomTarget.sc;
  zoomTarget.sc=newSc;
  if(!zoomRaf)zoomRaf=requestAnimationFrame(smoothZoomStep);
}
function resetView(){hideAllL2();hideAllCtas();flyTo(START_CX,700,0.065,true)}

// Section zoom scales
function sectionScale(sec){
  if(!sec.l2.length)return 0.75;
  const l2cxs=sec.l2.map(l=>l.cx);
  const span=(Math.max(...l2cxs)-Math.min(...l2cxs))+CW+100;
  return Math.min(0.65,Math.max(0.18,(container.clientWidth*0.85)/span));
}
function l2Scale(){return 0.72}
const L1_FOCUS_CY=545;  // vertical centre of L1 pill + card + CTA
function l1FocusScale(){
  // fit pill (y=310) → CTA button bottom (y=790) with padding
  const contentH=480, contentW=CW+80;
  const sh=container.clientHeight*0.82/contentH;
  const sw=container.clientWidth*0.78/contentW;
  return Math.min(sh,sw,1.5);
}

// ═══════════════════════════════════════════
// L2 SHOW / HIDE
// ═══════════════════════════════════════════
function hideAllCtas(){
  document.querySelectorAll('.show-l2-btn').forEach(b=>b.classList.remove('visible'));
}
function hideAllL2(){
  document.querySelectorAll('.l2-svg-group').forEach(g=>g.style.display='none');
  document.querySelectorAll('.pill[data-level="l2"]').forEach(p=>p.style.display='none');
  document.querySelectorAll('.pill[data-level="l3"]').forEach(p=>p.style.display='none');
  document.querySelectorAll('.card[data-level="l2"]').forEach(c=>c.style.display='none');
  l2Opened.clear();
}
function revealL2(secId){
  const sec=SECTIONS.find(s=>s.id===secId);if(!sec)return;
  l2Opened.add(secId);
  // Show SVG group
  const g=svg.querySelector(`.l2-svg-group[data-l2sec="${secId}"]`);
  if(g)g.style.display='';
  // Show pills
  document.querySelectorAll(`.pill[data-section="${secId}"][data-level="l2"]`).forEach(p=>p.style.display='');
  document.querySelectorAll(`.pill[data-l2sec="${secId}"][data-level="l3"]`).forEach(p=>p.style.display='');
  // Show cards
  document.querySelectorAll(`.card[data-l2sec="${secId}"]`).forEach(c=>c.style.display='');
  // Hide CTA
  const btn=canvas.querySelector(`.show-l2-btn[data-l2sec="${secId}"]`);
  if(btn)btn.classList.remove('visible');
  // Zoom to full section view
  flyTo(sec.cx,1000,sectionScale(sec));
}

// ═══════════════════════════════════════════
// SECTION HIGHLIGHT
// ═══════════════════════════════════════════
let highlightBox=null;
function clearHighlight(){
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('highlight','dimmed'));
  if(highlightBox){highlightBox.remove();highlightBox=null}
}
function highlightSection(secId){
  clearHighlight();
  const sec=SECTIONS.find(s=>s.id===secId);if(!sec)return;
  document.querySelectorAll('.pill').forEach(p=>{
    const matches=p.dataset.section===secId||(p.textContent==='BHARTI.COM');
    p.classList.toggle('highlight',matches);
    p.classList.toggle('dimmed',!matches&&p.dataset.section&&p.dataset.section!==secId);
  });
}
function highlightL2(secId,l2idx){
  clearHighlight();
  const sec=SECTIONS.find(s=>s.id===secId);if(!sec||!sec.l2[l2idx])return;
  const l2=sec.l2[l2idx];
  document.querySelectorAll('.pill').forEach(p=>{
    const isTarget=p.dataset.section===secId&&p.dataset.l2cx==l2.cx;
    const isParent=p.textContent===sec.name||p.textContent==='BHARTI.COM';
    p.classList.toggle('highlight',isTarget||isParent);
    p.classList.toggle('dimmed',!isTarget&&!isParent&&p.dataset.section);
  });
}

// ═══════════════════════════════════════════
// TOUR LOGIC
// ═══════════════════════════════════════════
const mainStops=[
  {id:'overview',name:'Overview',desc:'Full site structure — 9 primary sections · 38 page templates · 65-80 total URLs',cx:START_CX,cy:600,sc:0.065},
  ...SECTIONS.map(s=>({id:s.id,name:s.name,desc:s.desc,cx:s.cx,cy:600,sc:sectionScale(s),data:s}))
];

function buildJumpMenu(){
  const sel=document.getElementById('tour-jump');
  mainStops.forEach((s,i)=>{
    if(i===0)return;
    const o=document.createElement('option');o.value=i;o.textContent=s.name;sel.appendChild(o);
  });
}
function jumpToSection(val){
  if(!val)return;
  currentStop=parseInt(val);currentL2idx=-1;
  applyStop(currentStop);
  document.getElementById('tour-jump').value='';
}

function applyStop(idx,l2idx=-1){
  const stop=mainStops[idx];
  if(!stop)return;
  currentL2idx=l2idx;

  if(l2idx===-1){
    // L1 stop
    currentSectionId=stop.id;
    const sec=stop.data;
    // Hide all L2, show CTA for this section, use L1-only zoom
    hideAllL2();
    hideAllCtas();
    if(sec&&sec.l2.length){
      const btn=canvas.querySelector(`.show-l2-btn[data-l2sec="${stop.id}"]`);
      if(btn)btn.classList.add('visible');
      flyTo(stop.cx,L1_FOCUS_CY,l1FocusScale());
    } else {
      flyTo(stop.cx,L1_FOCUS_CY,l1FocusScale());
    }
    updateBar(stop,null);
    if(sec){highlightSection(stop.id);syncIslandNav(stop.id);}
    else{clearHighlight();syncIslandNav(null);}
  } else {
    // L2 stop
    const sec=stop.data;
    const l2=sec.l2[l2idx];
    flyTo(l2.cx,1000,l2Scale());
    updateBar(stop,l2);
    highlightL2(stop.id,l2idx);
  }
  updateNavButtons();
}
function updateBar(stop,l2){
  if(l2){
    document.getElementById('tour-name').textContent=l2.name;
    document.getElementById('tour-desc').textContent=stop.name+' — '+l2.name;
    document.getElementById('bc-l1').textContent=stop.name;
    document.getElementById('bc-l1').style.color='#1A4040';
    // L3 chips if any
    const chips=(l2.l3||[]).map(l3=>`<span class="chip l3-chip" onclick="void(0)">${l3.name}</span>`).join('');
    document.getElementById('tour-chips').innerHTML=chips||'';
  } else {
    document.getElementById('tour-name').textContent=stop.name;
    document.getElementById('tour-desc').textContent=stop.desc;
    document.getElementById('bc-l1').textContent=stop.name;
    document.getElementById('bc-l1').style.color=stop.id==='overview'?'#aaa':'#111';
    // L2 chips
    const data=stop.data;
    if(data&&data.l2.length){
      const chips=data.l2.map((l2,i)=>`<span class="chip" onclick="gotoL2(${mainStops.indexOf(stop)},${i})">${l2.name}</span>`).join('');
      document.getElementById('tour-chips').innerHTML=chips;
    } else {
      document.getElementById('tour-chips').innerHTML='';
    }
  }
  const n=mainStops.length-1;
  document.getElementById('tour-counter').textContent=currentStop===0?'Overview':`${currentStop} / ${n}`;
}
function gotoL2(stopIdx,l2idx){
  currentStop=stopIdx;applyStop(stopIdx,l2idx);
}
function goBackToL1(){
  if(currentL2idx>-1&&currentStop>0){applyStop(currentStop,-1);}
}
function updateNavButtons(){
  document.getElementById('btn-prev').disabled=currentStop<=0&&currentL2idx<0;
  document.getElementById('btn-next').disabled=currentStop>=mainStops.length-1&&currentL2idx<0;
}
function nextStop(){
  const stop=mainStops[currentStop];
  const sec=stop?stop.data:null;
  if(currentL2idx>-1){
    // In an L2 item — step to next L2 or advance to next L1
    const next=currentL2idx+1;
    if(next<sec.l2.length){applyStop(currentStop,next);return;}
    if(currentStop<mainStops.length-1){currentStop++;applyStop(currentStop);}
    return;
  }
  // At L1 — if L2 is currently open for this section, enter it
  if(sec&&sec.l2.length&&l2Opened.has(sec.id)){applyStop(currentStop,0);return;}
  // L2 closed or no L2 — jump to next L1
  if(currentStop<mainStops.length-1){currentStop++;applyStop(currentStop);}
}
function prevStop(){
  if(currentL2idx>-1){
    // In L2 — step back through L2 or return to L1
    if(currentL2idx>0){applyStop(currentStop,currentL2idx-1);return;}
    applyStop(currentStop,-1);
    return;
  }
  // At L1 — go to previous L1
  if(currentStop>0){currentStop--;applyStop(currentStop);}
}
function setTourBtnState(active){
  const btn=document.getElementById('btn-tour');
  const icon=document.getElementById('tour-icon');
  if(active){
    btn.classList.add('active');
    icon.setAttribute('data-lucide','square');
    icon.style.fill='currentColor';icon.style.stroke='none';
    btn.lastChild.textContent='Stop Tour';
  } else {
    btn.classList.remove('active');
    icon.setAttribute('data-lucide','play');
    icon.style.fill='currentColor';icon.style.stroke='none';
    btn.lastChild.textContent='Start Tour';
  }
  lucide.createIcons({nodes:[icon]});
}
function startTour(){
  document.getElementById('overview-hint').classList.add('hidden');
  tourActive=true;
  setTourBtnState(true);
  currentStop=1;applyStop(1);
}
function stopTour(){
  tourActive=false;
  setTourBtnState(false);
}
function toggleTour(){tourActive?stopTour():startTour();}
function closeHint(){
  document.getElementById('overview-hint').classList.add('hidden');
  focusSection('home');
}

// ISLAND NAV
// ═══════════════════════════════════════════
function buildIslandNav(){
  const nav=document.getElementById('island-nav');
  nav.innerHTML='';
  SECTIONS.forEach((sec,i)=>{
    if(i>0){
      const sep=document.createElement('div');
      sep.className='inav-sep';
      nav.appendChild(sep);
    }
    const btn=document.createElement('button');
    btn.className='inav-tab';
    btn.dataset.secid=sec.id;
    const label=sec.name.split(' ').map(w=>w[0]+w.slice(1).toLowerCase()).join(' ');
    let html=label;
    if(sec.l2&&sec.l2.length){
      html+=` <span class="inav-count">${sec.l2.length}</span>`;
    }
    btn.innerHTML=html;
    btn.onclick=()=>focusSection(sec.id);
    nav.appendChild(btn);
  });
}
function syncIslandNav(secId){
  document.querySelectorAll('.inav-tab').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.secid===secId);
  });
}
function focusSection(secId){
  const idx=mainStops.findIndex(s=>s.id===secId);
  if(idx>-1){currentStop=idx;applyStop(idx);}
}
function focusL2(secId,l2idx){
  const idx=mainStops.findIndex(s=>s.id===secId);
  if(idx>-1){currentStop=idx;applyStop(idx,l2idx);}
}

  document.body.classList.toggle('sitemap',m==='sitemap');
  document.getElementById('btn-ia').classList.toggle('active',m==='ia');
  document.getElementById('btn-sm').classList.toggle('active',m==='sitemap');

  resetView();
}

// PAN + ZOOM EVENTS
// ═══════════════════════════════════════════
container.addEventListener('mousedown',e=>{
  if(e.button!==0||e.target.closest('.pill,.chip'))return;
  isPanning=true;panSX=e.clientX;panSY=e.clientY;panTX=tx;panTY=ty;
  container.classList.add('panning');canvas.style.transition='none';
});
document.addEventListener('mousemove',e=>{
  if(!isPanning)return;
  tx=panTX+(e.clientX-panSX);ty=panTY+(e.clientY-panSY);
  canvas.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
});
document.addEventListener('mouseup',()=>{if(isPanning){isPanning=false;container.classList.remove('panning');}});
// Smooth zoom — accumulate delta and animate with rAF
let zoomTarget={sc,tx,ty};
let zoomRaf=null;
let zoomEase=0.12; // wheel zoom: gentle; flyTo overrides to faster
function smoothZoomStep(){
  const ease=zoomEase;
  const dsc=zoomTarget.sc-sc;
  const dtx=zoomTarget.tx-tx;
  const dty=zoomTarget.ty-ty;
  if(Math.abs(dsc)<0.0002&&Math.abs(dtx)<0.15&&Math.abs(dty)<0.15){
    sc=zoomTarget.sc;tx=zoomTarget.tx;ty=zoomTarget.ty;
    applyTransform(false);zoomRaf=null;zoomEase=0.12;return;
  }
  sc+=dsc*ease;tx+=dtx*ease;ty+=dty*ease;
  applyTransform(false);
  zoomRaf=requestAnimationFrame(smoothZoomStep);
}
container.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.06:1/1.06;
  const newSc=Math.max(0.04,Math.min(3,zoomTarget.sc*f));
  const rect=container.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  zoomTarget.tx=mx-(mx-zoomTarget.tx)*newSc/zoomTarget.sc;
  zoomTarget.ty=my-(my-zoomTarget.ty)*newSc/zoomTarget.sc;
  zoomTarget.sc=newSc;
  if(!zoomRaf)zoomRaf=requestAnimationFrame(smoothZoomStep);
},{passive:false});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')nextStop();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')prevStop();
  if(e.key==='r'||e.key==='R')resetView();
  if(e.key==='t'||e.key==='T')toggleTour();
  if(e.key==='m'||e.key==='M')setMode(document.body.classList.contains('sitemap')?'ia':'sitemap');
  if(e.key==='Escape'){clearHighlight();stopTour();}
});

// ═══════════════════════════════════════════
buildCanvas();
buildJumpMenu();
buildIslandNav();

// Initial camera — center on full canvas
const vpw=container.clientWidth,vph=container.clientHeight;
tx=vpw/2-START_CX*sc; ty=vph/2-600*sc;
zoomTarget={sc,tx,ty};
applyTransform(false);

document.getElementById('tour-counter').textContent='—';
updateNavButtons();
</script>
